[project]
name = "GO-Diff"
version = "0.0.1"
description = "GO-Diff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "lightning",
    "torch_geometric",
    "torch-ema",
    "tensorboard",
    "numpy",
    "ase",
    "rich-click",
    "schnetpack",
    "AGeDi",
    "matplotlib",
    "seaborn",
]


