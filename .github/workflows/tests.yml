name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-lockfile:
    name: Validate uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Verify uv.lock is up to date
        run: uv lock --check

  build:
    name: Test Python ${{ matrix.python-version }}
    needs: validate-lockfile # Fails fast before running the matrix if the lock is out of date
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        
    - name: Install dependencies
      # uv fetches the target Python version and syncs the exact locked environment
      run: uv sync --python ${{ matrix.python-version }} --extra test --extra full
      
    - name: Test with pytest
      run: uv run pytest

